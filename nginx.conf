server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Assets con hash en el nombre: caché largo
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Rutas de la SPA: si el archivo no existe, devolver index.html
  location / {
    try_files $uri /index.html;
  }
}
